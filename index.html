<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crochê da Su - Feito à mão com amor</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <div class="branding">
                <h1>Crochê da Su</h1>
                <p>"Feito à mão, com amor e sofisticação"</p>
            </div>

            <div class="search-area">
                <input type="text" id="barraPesquisa" placeholder="O que você procura hoje?">
                <button class="search-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>

            <div class="user-actions">
                <a href="https://www.instagram.com/croochedasu_?igsh=MTJ1Y2U3bHB4cXN0Mw==" class="icon-wrapper instagram-icon" title="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-instagram"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                
                <button id="abrirCarrinho" class="cart-button" title="Carrinho">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shopping-cart"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <nav class="categorias-nav">
        <button class="cat-btn ativo" data-cat="todos">Todos os Produtos</button>
        <button class="cat-btn" data-cat="bolsas">Bolsas</button>
        <button class="cat-btn" data-cat="decoracao">Decoração & Casa</button>
        <button class="cat-btn" data-cat="acessorios">Acessórios</button>
    </nav>

    <div class="carrinho" id="meuCarrinho">
        <button id="fecharCarrinho" class="fechar-carrinho-btn">×</button>
        <h2>Seu Carrinho</h2>
        <ul id="lista-carrinho" style="list-style: none; padding: 0;"></ul>
        <p id="total-carrinho">Total: R$ 0,00</p>
        <button class="btn-finalizar">Finalizar Compra</button>
    </div>

    <main class="container" id="container-produtos">
        </main>

    <footer>
        <p>&copy; 2025 Crochê da Su | Feito com 💖</p><p>Desenvolvido Por Giulia Carvalho</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
